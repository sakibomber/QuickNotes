<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!--
      No viewport-fit=cover, deliberately.

      Cover extends the viewport UNDER the Android system navigation bar, and
      then you depend on env(safe-area-inset-bottom) to push content back up.
      Chrome on Android reports that inset as 0 with 3-button navigation, so on
      an S23 the bottom nav rendered completely behind the system buttons —
      only a sliver was tappable. Edge-to-edge is not worth hiding the
      navigation. The safe-area padding is kept as belt-and-braces; it is a
      no-op when the inset is 0.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#14170F" />
    <meta name="description" content="Quick Notes — Capture. File. Remember." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Quick Notes" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png" />
    <title>Quick Notes</title>
    <script>
      // Apply the saved theme + text size before first paint so there is no flash.
      // Settings live in IndexedDB (async), so a mirror is kept in localStorage purely
      // for this synchronous boot step.
      try {
        var t = localStorage.getItem('qn.theme');
        if (t === 'sepia' || t === 'dark') document.documentElement.dataset.theme = t;
        var s = localStorage.getItem('qn.textScale');
        if (s) document.documentElement.style.setProperty('--ui-scale', s);
        var g = localStorage.getItem('qn.navGutter');
        document.documentElement.style.setProperty('--nav-gutter', (g === null ? 48 : g) + 'px');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Quick Notes needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
